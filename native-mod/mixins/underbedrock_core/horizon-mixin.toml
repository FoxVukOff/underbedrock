[mod]
id = "underbedrock_core"
version = "0.0.1"
priority = 100

# The revision its sources compile against, and why not the newest nightly:
# the nightly's horizon-client lib.rs gained `#![recursion_limit = "256"]`, an
# attribute the mixin compiler (horizon-mixins ddd9700) reads as an unexpanded
# macro and refuses to patch anything under (E_UNSUPPORTED_MACRO) - every hook
# point this mod binds exists here with the same signature, so this stays the
# pin until the compiler learns the attribute. The game it RUNS on is another
# matter: `hooks` 164 in horizon-native.json names the newest hook point it
# uses, and the launcher builds and loads it only on a Horizon whose hook
# points are that version or later - a recent nightly.
[compatibility]
horizon_revision = "ea5599757087a6f2ee0702dd469b79aa21bfb199"

# The mod's own logic and state, added to the game as `crate::game::underbedrock_core`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "underbedrock_core"
source = "runtime.rs"

# The mod's row in Options > Mods.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Its settings page: the dig time and whether bedrock drops.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# The dig itself: each tick of a player, with the engine's own dig state
# swapped in for them (the block they hold the attack key on, and for how
# many ticks).
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# /abyss in the server's command tree.
[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_hooks::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# A world closed: forget what the mod kept for it, so a reopened one starts
# clean (API 134).
[[injection]]
id = "level-unload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_unload"
helper = "level_unload.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# A death's drops: a layer's hunter leaves its shard as a trophy (API 75).
[[injection]]
id = "loot-drops"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_loot_drops"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "drops" },
]

# The dig's feedback, heard on the client: the sound and the blue sparks of a
# break the server sent over the net bridge (API 40).
[[injection]]
id = "net-from-server"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net_from_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]
